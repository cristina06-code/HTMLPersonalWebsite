<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Cristina Muntean | Portfolio</title>
		<link rel="stylesheet" href="./css/style.css">
	</head>
	<body>
		<div class="layout">

			<div class="LeftSide">
				<div>
					<div class="about-me">
						<a href="#about-me">
							<img src="./images/portrait.jpg" class="my-image" alt="Portrait of Cristina Muntean">
						</a>
						<div class="about-me-text">
							<a href="#about-me"><h2>Cristina Muntean</h2></a>
							<p class="role-tag">IT Product-Development Student</p>
							<p>
								Passionate about Embedded Systems, Robotics, and IoT.
							</p>
						</div>
					</div>

					<div class="menu">
						<ul>
							<li><a href="#about-me" data-section="about-me">About Me</a></li>
							<li><a href="#skills" data-section="skills">Skills</a></li>
							<li><a href="#projects" data-section="projects">Projects</a></li>
						</ul>
					</div>
				</div>

				<div class="contact-methods">
					<h3>Contact Me</h3>
					<ul>
						<li><a href="https://www.linkedin.com/in/cristina-muntean-853992370/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><ion-icon name="logo-linkedin"></ion-icon></a></li>
						<li><a href="https://github.com/cristina06-code" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><ion-icon name="logo-github"></ion-icon></a></li>
						<li><a href="mailto:kristinamuntean2006@gmail.com" aria-label="Email"><ion-icon name="mail"></ion-icon></a></li>
					</ul>
					<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
					<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
				</div>
			</div>

			<div class="RightSide">
				<!-- About Me -->
				<div id="about-me">
					<!-- <p class="eyebrow">SIG_01 // About</p> -->
					<h2 class="eyebrow">About me</h2>
					<div id="text-container">Loading text...</div>
				</div>
				<!-- Skills -->
				<div id="skills">
					<!-- <p >SIG_02 // Skills</p> -->
					<h2 class="eyebrow">Skills</h2>
					<div class="skills"></div>
				</div>
				<!-- Projects -->
				<div id="projects">
					<!-- <p class="eyebrow">SIG_03 // Projects</p> -->
					<h2 class="eyebrow">Projects</h2>
					<div class="project-carousel">
						<div class="project-card" id="project-card">
							<!-- filled by app.js -->
						</div>
						<div class="carousel-nav">
							<button class="carousel-arrow" id="prev-project" aria-label="Previous project">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
							</button>
							<span class="carousel-dots" id="project-counter">1 / 3</span>
							<button class="carousel-arrow" id="next-project" aria-label="Next project">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
							</button>
						</div>
						<a class="github-more" href="https://github.com/cristina06-code" target="_blank" rel="noopener noreferrer">Find more projects on my GitHub</a>
					</div>
				</div>
			</div>
		</div>

		<script src="./js/app.js"></script>
	</body>
</html>
